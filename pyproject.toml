[project]
name = "saved-places-local"
version = "0.1.0"
description = "Build a local HTML guide from your own Instagram collections"
requires-python = ">=3.12,<3.13"
dependencies = ["instagrapi==2.18.18", "requests==2.34.2", "jinja2>=3.1.6", "pydantic>=2.11", "pillow>=11"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
